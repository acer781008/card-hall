<div id="notice" class="notice"></div><div class="wrap"><div class="title">🎴 多人棋牌館｜主控室 V2.1.0 正式版</div><div class="panel">
<div class="row">
<div class="field"><span class="label">遊戲</span><select id="game"><option value="big2">大老二</option><option value="sevens">接龍</option><option value="chinese">十三支</option><option value="landlord">鬥地主</option><option value="mahjong">麻將</option><option value="ninety9">99</option><option value="redpoint">撿紅點</option><option value="blackjack">21點</option><option value="texas">德州撲克</option></select></div>
<div class="field" id="big2ModeField"><span class="label">大老二玩法</span><select id="big2Mode"><option value="classic" selected>經典版</option><option value="traditional">傳統版</option></select></div><div class="field"><span class="label">房間密碼（可空白）</span><input id="password" maxlength="16" placeholder="不設可留白"></div>
<div class="field"><span class="label">滿員自動開始</span><select id="auto"><option value="1">開</option><option value="0">關</option></select></div>
<div class="field"><span class="label">開始倒數</span><select id="startCd"><option>3</option><option selected>5</option><option>10</option><option>15</option></select></div>
<div class="field"><span class="label">🤖 AI 補位</span><select id="aiMode"><option value="none">不使用 AI</option><option value="manual">主控手動補滿</option><option value="auto">等待後自動補滿</option></select></div>
<div class="field" id="aiWaitField" style="display:none"><span class="label">AI 等待秒數</span><select id="aiWait"><option>30</option><option selected>60</option><option>90</option><option>120</option><option>180</option><option value="custom">自訂</option></select></div>
<div class="field" id="aiCustomField" style="display:none"><span class="label">自訂秒數</span><input id="aiCustom" type="number" min="10" max="600" value="60"></div>

<div class="field"><span class="label">出牌時間</span><select id="turnSeconds"><option value="0">不限時</option><option>10</option><option>15</option><option selected>20</option><option>30</option><option>45</option><option>60</option></select></div>
<div class="field"><span class="label">📝 分享備註／名稱（選填）</span><input id="shareNote" maxlength="40" placeholder="例如：晚上好友場"></div>

<div class="field"><span class="label">回合間隔</span><select id="between"><option>3</option><option>5</option><option selected>8</option><option>10</option><option>15</option></select></div>
<div class="field"><span class="label">玩完繼續新一場</span><select id="continuous"><option value="0">否</option><option value="1">是</option></select></div>
<button id="create" class="btn gold">＋ 建立房間</button></div><div class="myRoomsTitle">🏠 我的房間 <small>只顯示並管理你建立的房間</small></div><div id="rooms"></div><div class="archiveTitle">📚 開房紀錄 <small>刪除房間後仍保留，需手動刪除紀錄</small></div><div id="archives"><p>載入中…</p></div></div></div>
