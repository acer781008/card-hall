<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多人棋牌館 主控室 V1.1.2 公開測試版</title><link rel="stylesheet" href="common.css"><script>if(sessionStorage.getItem("cardhall_admin_auth_v111")!=="ok")location.replace("admin-login.html");</script><style>.lobbyBackBtn{position:fixed;right:14px;top:14px;z-index:9999;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.96);color:#274d40!important;text-decoration:none!important;font-weight:900;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.22)}@media(max-width:600px){.lobbyBackBtn{right:8px;top:8px;padding:8px 10px;font-size:12px}}</style></head><body><a class="lobbyBackBtn" href="https://game-lobby-eo8o.onrender.com/">← 返回遊戲大廳</a>
<div id="notice" class="notice"></div><div class="wrap"><div class="title">🎴 多人棋牌館｜主控室 V1.1.2 公開測試版</div><div class="panel">
<div class="row">
<div class="field"><span class="label">遊戲</span><select id="game"><option value="big2">大老二</option><option value="sevens">牌七</option><option value="chinese">十三支</option><option value="landlord">鬥地主</option><option value="mahjong">麻將</option></select></div>
<div class="field"><span class="label">房間密碼（可空白）</span><input id="password" maxlength="16" placeholder="不設可留白"></div>
<div class="field"><span class="label">滿員自動開始</span><select id="auto"><option value="1">開</option><option value="0">關</option></select></div>
<div class="field"><span class="label">開始倒數</span><select id="startCd"><option>3</option><option selected>5</option><option>10</option><option>15</option></select></div>
<div class="field"><span class="label">出牌秒數</span><select id="turn"><option>15</option><option>20</option><option selected>30</option><option>45</option><option>60</option></select></div>
<div class="field"><span class="label">回合數</span><select id="rounds"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>10</option></select></div>
<div class="field"><span class="label">回合間隔</span><select id="between"><option>3</option><option>5</option><option selected>8</option><option>10</option><option>15</option></select></div>
<div class="field"><span class="label">玩完繼續新一場</span><select id="continuous"><option value="0">否</option><option value="1">是</option></select></div>
<button id="create" class="btn gold">＋ 建立房間</button></div><div id="rooms"></div></div></div>
<script src="/socket.io/socket.io.js"></script><script src="admin.js"></script></body></html>
