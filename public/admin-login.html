<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>多人棋牌館 V1.1.1｜主控登入</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Noto Sans TC",sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 50% 15%,#315c4b 0,#173b31 38%,#0b241d 100%);color:#fff;display:grid;place-items:center;padding:18px}
.card{width:min(430px,100%);background:rgba(8,27,22,.94);border:1px solid rgba(255,224,135,.45);border-radius:24px;padding:28px;box-shadow:0 20px 55px rgba(0,0,0,.4);text-align:center}
h1{margin:0 0 6px;color:#ffe6a2}p{opacity:.78;margin:0 0 22px}
input{width:100%;font-size:18px;padding:14px 15px;border-radius:13px;border:1px solid #6e8b7d;outline:none;margin-bottom:12px}
button,a{display:block;width:100%;padding:13px;border:0;border-radius:13px;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}
button{background:#f3ce69;color:#2a2615}a{margin-top:10px;background:#fff;color:#20493d}
.err{min-height:24px;color:#ffb5b5;margin-top:8px;font-weight:700}
.small{font-size:12px;opacity:.62;margin-top:15px}
</style></head>
<body><main class="card">
<h1>🎴 多人棋牌館</h1><p>主控管理登入</p>
<form id="f"><input id="pw" type="password" autocomplete="current-password" placeholder="請輸入主控密碼" required>
<button type="submit">進入主控管理</button></form>
<div id="err" class="err"></div>
<a href="https://game-lobby-eo8o.onrender.com/">← 返回遊戲大廳</a>
<div class="small">V1.1.1 上線安全修正版</div>
</main>
<script>
const KEY="cardhall_admin_auth_v111";
if(sessionStorage.getItem(KEY)==="ok") location.replace("admin.html");
document.querySelector("#f").addEventListener("submit",e=>{
 e.preventDefault();
 const pw=document.querySelector("#pw").value;
 if(pw==="1234"){sessionStorage.setItem(KEY,"ok");location.replace("admin.html")}
 else document.querySelector("#err").textContent="主控密碼錯誤";
});
</script></body></html>
