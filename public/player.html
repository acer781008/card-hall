<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多人棋牌館 玩家頁</title><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="player.css"><style>.lobbyBackBtn{position:fixed;right:14px;top:14px;z-index:9999;display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.96);color:#274d40!important;text-decoration:none!important;font-weight:900;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.22)}@media(max-width:600px){.lobbyBackBtn{right:8px;top:8px;padding:8px 10px;font-size:12px}}</style></head><body><a class="lobbyBackBtn" href="https://game-lobby-eo8o.onrender.com/">← 返回遊戲大廳</a>
<div id="notice" class="notice"></div><div id="joinWrap" class="wrap"><div class="title">🃏 多人棋牌館｜玩家</div><div class="panel join"><span class="label">玩家名稱</span><input id="name" maxlength="12" placeholder="輸入名稱"><span class="label">房號</span><input id="code" maxlength="6" inputmode="numeric" placeholder="6 位房號"><div id="pwdWrap" class="hidden"><span class="label">房間密碼</span><input id="pwd" maxlength="16" placeholder="輸入房間密碼"></div><button id="join" class="btn gold">加入遊戲</button><div class="small">重新整理或短暫斷線後，60 秒內可回原座位。</div></div></div>
<div id="gameWrap" class="wrap hidden"><div class="topbar"><b id="gameName"></b><span>房號 <b id="roomCode"></b></span><span>連線 <b id="online"></b></span><span>第 <b id="round"></b> 回合</span><button id="soundBtn" class="btn green">🔊 聲音：開</button><button id="rulesBtn" class="btn purple">📖 規則</button><button id="leaveBtn" class="btn red">離開房間</button></div><div class="wood"><div class="felt"><div id="seats" class="seatsP"></div><div id="countdown" class="overlay hidden"></div><div class="center"><div id="turnText" class="turnText"></div><div id="timer" class="timer"></div><div id="board" class="board"></div></div><div class="history"><b>最近紀錄</b><div id="history"></div></div><div class="bottom"><div id="hand" class="hand"></div><div class="buttons"><button id="playBtn" class="btn blue">出牌</button><button id="coverBtn" class="btn gold hidden">蓋牌</button><button id="passBtn" class="btn green">PASS</button><button id="cancelBtn" class="btn gray">取消選取</button><button id="specialBtn" class="btn gold hidden"></button><button id="mjWinBtn" class="btn red hidden">胡</button><button id="mjPongBtn" class="btn gold hidden">碰</button><button id="mjKongBtn" class="btn purple hidden">槓</button><button id="mjChowBtn" class="btn green hidden">吃</button><button id="mjPassBtn" class="btn gray hidden">過</button></div></div></div></div></div>
<div id="result" class="modal hidden"><div class="panel result"><div style="font-size:54px">🏆</div><h2 id="resultTitle"></h2><div id="winnerText"></div><div id="ranking"></div><div id="nextText" class="small"></div></div></div>
<script src="/socket.io/socket.io.js"></script><script src="player.js"></script></body></html>
