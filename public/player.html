<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多人棋牌館 V2.1.0｜玩家頁</title><link rel="stylesheet" href="common.css?v=20260903-10"><link rel="stylesheet" href="player.css?v=20260903-10"></head><body>
<div id="notice" class="notice"></div><div id="joinWrap" class="wrap"><div class="title">🃏 多人棋牌館｜玩家</div><div class="panel join"><span class="label">玩家名稱</span><input id="name" maxlength="12" placeholder="輸入名稱"><span class="label">房號</span><input id="code" maxlength="6" inputmode="numeric" placeholder="6 位房號"><div id="pwdWrap" class="hidden"><span class="label">房間密碼</span><input id="pwd" maxlength="16" placeholder="輸入房間密碼"></div><button id="join" class="btn gold">加入遊戲</button><div class="small">若連線中斷，請重新加入房間。</div></div></div>
<div id="gameWrap" class="wrap hidden"><div class="topbar"><b id="gameName"></b><span>房號 <b id="roomCode"></b></span><span>連線 <b id="online"></b></span><span>第 <b id="round"></b> 回合</span><button id="soundBtn" class="btn green">🔊 聲音：開</button><button id="emojiBtn" class="btn gold">😀 表情</button><button id="rulesBtn" class="btn purple">📖 規則</button><button id="leaveBtn" class="btn red">離開房間</button></div><div id="emojiMenu" class="emojiMenu hidden">👍 😂 😱 👏 😤 🤔</div><div id="emojiFloat" class="emojiFloat hidden"></div><div class="wood"><div class="felt"><div id="seats" class="seatsP"></div><div id="countdown" class="overlay hidden"></div><div class="center"><div id="turnText" class="turnText"></div><div id="timer" class="timer"></div><div id="board" class="board"></div></div><div class="history"><b>最近紀錄</b><div id="history"></div></div><div class="bottom"><div class="buttons"><button id="passBtn" class="btn red">PASS</button><button id="playBtn" class="btn blue">出牌</button><button id="coverBtn" class="btn gold hidden">蓋牌</button><button id="cancelBtn" class="btn gray">取消選取</button><button id="specialBtn" class="btn gold hidden"></button><button id="altBtn" class="btn green hidden"></button><button id="mjWinBtn" class="btn red hidden">胡</button><button id="mjPongBtn" class="btn gold hidden">碰</button><button id="mjKongBtn" class="btn purple hidden">槓</button><button id="mjChowBtn" class="btn green hidden">吃</button><button id="mjPassBtn" class="btn gray hidden">過</button></div><div id="hand" class="hand"></div></div></div></div></div>

<div id="mjDiscardFlash" class="mjDiscardFlash hidden"><div id="mjDiscardName"></div><img id="mjDiscardImg"></div>
<div id="chineseModal" class="modal hidden"><div class="panel chinesePanel"><h2>十三支排牌</h2><div class="small">前墩 3 張｜中墩 5 張｜後墩 5 張，後墩不可小於中墩，中墩不可小於前墩</div><div id="chineseRecs" class="chineseRecs"></div><div class="czone"><b>前墩（3）</b><div id="czFront" class="czCards"></div></div><div class="czone"><b>中墩（5）</b><div id="czMiddle" class="czCards"></div></div><div class="czone"><b>後墩（5）</b><div id="czBack" class="czCards"></div></div><div class="czone"><b>未分配手牌</b><div id="czPool" class="czCards"></div></div><div class="chineseActions"><button id="czToFront" class="btn blue">放前墩</button><button id="czToMiddle" class="btn green">放中墩</button><button id="czToBack" class="btn purple">放後墩</button><button id="czToPool" class="btn gray">移回手牌</button><button id="czSubmit" class="btn gold">確認提交</button><button id="czClose" class="btn gray">關閉</button></div></div></div>
<div id="chowModal" class="modal hidden"><div class="panel chowPanel"><h2>選擇吃法</h2><div id="chowChoices" class="chowChoices"></div><button id="chowCancel" class="btn gray">取消</button></div></div>
<div id="result" class="modal hidden"><div class="panel result"><div style="font-size:54px">🏆</div><h2 id="resultTitle"></h2><div id="winnerText"></div><div id="ranking"></div><div id="nextText" class="small"></div></div></div>
<script src="/socket.io/socket.io.js"></script><script src="player.js?v=20260903-10"></script></body></html>
